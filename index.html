<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eternity Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    // Firebase imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAV5OYU2OFG5gNk8pD8TpfMM5kdYf7ap9U",
      authDomain: "myappkeyswa.firebaseapp.com",
      projectId: "myappkeyswa",
      storageBucket: "myappkeyswa.firebasestorage.app",
      messagingSenderId: "909453957465",
      appId: "1:909453957465:web:e8ccef0fa01627be051448",
      measurementId: "G-ZJN37Y1Q2G"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Handle authentication state
    onAuthStateChanged(auth, (user) => {
      const loginPage = document.getElementById("loginPage");
      const dashboard = document.getElementById("dashboard");
      const userEmail = document.getElementById("userEmail");

      if (user) {
        loginPage.classList.add("hidden");
        dashboard.classList.remove("hidden");
        userEmail.textContent = user.email;
      } else {
        loginPage.classList.remove("hidden");
        dashboard.classList.add("hidden");
      }
    });

    // Sign up
    window.registerUser = async function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        alert("✅ Account created successfully!");
      } catch (error) {
        alert(error.message);
      }
    };

    // Sign in
    window.loginUser = async function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        alert(error.message);
      }
    };

    // Logout
    window.logoutUser = async function () {
      await signOut(auth);
    };
  </script>
</head>
<body class="bg-[#0d0d0d] text-white flex justify-center items-center min-h-screen">

  <!-- LOGIN PAGE -->
  <div id="loginPage" class="w-full max-w-sm p-8 bg-[#131313] rounded-2xl shadow-lg border border-[#1f1f1f] text-center">
    <h1 class="text-2xl font-semibold mb-6 text-purple-400">Eternity Login</h1>

    <input id="email" type="email" placeholder="Email" class="w-full mb-3 px-4 py-2 rounded bg-[#0d0d0d] text-gray-300 border border-[#2a2a2a] focus:outline-none">
    <input id="password" type="password" placeholder="Password" class="w-full mb-5 px-4 py-2 rounded bg-[#0d0d0d] text-gray-300 border border-[#2a2a2a] focus:outline-none">

    <button onclick="loginUser()" class="w-full bg-purple-600 hover:bg-purple-700 py-2 rounded transition mb-2">Login</button>
    <button onclick="registerUser()" class="w-full bg-gray-700 hover:bg-gray-600 py-2 rounded transition">Register</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden w-full min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-[#131313] flex flex-col justify-between">
      <div>
        <div class="p-4 text-2xl font-semibold">Eternity Menu</div>
        <nav class="mt-4">
          <a href="#" class="flex items-center px-6 py-3 bg-purple-600 hover:bg-purple-700 rounded-r-full transition">Dashboard</a>
          <a href="#" class="flex items-center px-6 py-3 hover:bg-[#1b1b1b] transition">Scripts</a>
          <a href="#" class="flex items-center px-6 py-3 hover:bg-[#1b1b1b] transition">Configs</a>
        </nav>
      </div>

      <div class="p-4 flex items-center justify-between border-t border-[#1f1f1f]">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-gray-500 rounded-full"></div>
          <span id="userEmail" class="text-sm">User</span>
        </div>
        <button onclick="logoutUser()" class="text-xs bg-purple-600 px-3 py-1 rounded hover:bg-purple-700 transition">Logout</button>
      </div>
    </aside>

    <!-- Main Dashboard -->
    <main class="flex-1 p-10">
      <h1 class="text-2xl font-bold mb-2">Dashboard</h1>
      <p class="text-gray-400 mb-6">Overview of your Eternity account</p>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div class="bg-[#131313] p-5 rounded-2xl shadow-lg border border-[#1f1f1f]">
          <h2 class="text-sm text-gray-400 mb-1">Authentication Key</h2>
          <p class="font-semibold text-purple-400 text-lg">874251769016732955</p>
        </div>

        <div class="bg-[#131313] p-5 rounded-2xl shadow-lg border border-[#1f1f1f]">
          <h2 class="text-sm text-gray-400 mb-1">Time Remaining</h2>
          <p class="font-semibold text-white text-lg">Lifetime</p>
        </div>

        <div class="bg-[#131313] p-5 rounded-2xl shadow-lg border border-[#1f1f1f]">
          <h2 class="text-sm text-gray-400 mb-1">Total Injects</h2>
          <p class="font-semibold text-white text-lg">0</p>
          <span class="text-xs text-gray-500">Successful injections</span>
        </div>

        <div class="bg-[#131313] p-5 rounded-2xl shadow-lg border border-[#1f1f1f]">
          <h2 class="text-sm text-gray-400 mb-1">Last Inject</h2>
          <p class="font-semibold text-white text-lg">Never</p>
        </div>
      </div>

      <!-- Upload Section -->
      <div class="mt-10 bg-[#131313] p-6 rounded-2xl border border-[#1f1f1f]">
        <h2 class="text-lg font-semibold mb-4">Upload a File</h2>
        <form action="upload.php" method="post" enctype="multipart/form-data">
          <input type="file" name="fileToUpload" class="block w-full text-sm text-gray-400 mb-3 bg-[#0d0d0d] p-2 rounded">
          <button type="submit" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded transition">Upload</button>
        </form>
      </div>
    </main>
  </div>

</body>
</html>
