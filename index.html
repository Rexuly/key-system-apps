<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key System - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Key System for Game Menu</h1>
    <div class="form-container">
        <h2>Sign Up</h2>
        <div id="message" class="message"></div>
        <form id="signup-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="submit" value="Sign Up">
        </form>
        <p>Admin? <a href="#" onclick="showLogin()">Log in here</a></p>
        <p><a href="uploads/">View Hosted Files</a></p>
        <form id="login-form" style="display:none;">
            <h2>Admin Login</h2>
            <input type="password" id="admin-password" placeholder="Admin Password" required>
            <input type="submit" value="Log In" onclick="adminLogin()">
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
